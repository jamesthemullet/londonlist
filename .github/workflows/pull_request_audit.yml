name: CI Tests For London List
on:
  pull_request:
    branches: [main]
jobs:
  axe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      GITHUB_API_SECRET: ${{ secrets.PIPELINE_GITHUB_API_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: yarn install
      - name: Install ChromeDriver matching system Chrome 🌐
        run: |
          CHROME_FULL_VERSION=$(google-chrome --version | sed 's/Google Chrome //' | xargs)
          echo "System Chrome version: $CHROME_FULL_VERSION"
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FULL_VERSION}/linux64/chromedriver-linux64.zip" -O /tmp/chromedriver.zip
          unzip -q /tmp/chromedriver.zip -d /tmp/
          chmod +x /tmp/chromedriver-linux64/chromedriver
          echo "CHROMEDRIVER_PATH=/tmp/chromedriver-linux64/chromedriver" >> $GITHUB_ENV
      - run: yarn ts-check
      - run: yarn run build
      - run: yarn dev & npx wait-on http://localhost:3000
      - name: Run axe
        run: |
          yarn add @axe-core/cli
          npx axe --chromedriver-path "$CHROMEDRIVER_PATH" http://localhost:3000/ --load-delay=1500 --exit
