name: CI Tests For London List
on:
  pull_request:
    branches: [main]
jobs:
  axe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      GITHUB_API_SECRET: ${{ secrets.PIPELINE_GITHUB_API_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: yarn install
      - name: Get installed Chrome version 🌐
        run: |
          CHROMIUM_VERSION=$(google-chrome --version | awk '{print $3}')
          echo "Chromium version: $CHROMIUM_VERSION"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV
      - name: Install matching chromedriver 🚗
        working-directory: /tmp
        run: |
          echo "Downloading chromedriver for Chrome ${CHROMIUM_VERSION}"
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROMIUM_VERSION}/linux64/chromedriver-linux64.zip"
          unzip -o -q chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          echo "chromedriver version: $(chromedriver --version)"
      - run: yarn ts-check
      - run: yarn run build
      - run: yarn dev & npx wait-on http://localhost:3000
      - name: Run axe
        run: |
          yarn add @axe-core/cli
          npx axe --chromedriver-path /usr/local/bin/chromedriver http://localhost:3000/ --load-delay=1500 --exit
